<VirtualHost *:10000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <LocationMatch "^/(?!healthz(?:$|/))">
        AuthType Basic
        AuthName "QloApps demo property sandbox"
        AuthUserFile /var/lib/qloapps/.htpasswd
        Require valid-user
    </LocationMatch>
    <Location "/healthz">
        Require all granted
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
